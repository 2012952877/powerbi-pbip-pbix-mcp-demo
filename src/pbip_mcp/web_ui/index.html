<!doctype html>
<!--
THESIS: A conversion workspace: select, confirm, submit, retrieve. No marketing shell.
OWN-WORLD: Clawpilot light/dark tokens, Segoe UI, restrained rose actions and neutral surfaces.
STORY: A personal session leads to one upload form and only the user's actual jobs.
FIRST VIEWPORT: Compact identity bar; upload on the left, task history on the right.
FORM: Brief-pinned Operate split workspace, stacked on narrow screens. No random concept seed.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>PBIP ↔ PBIX 转换工作台</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font: 1rem/1.6 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
    button, input, select { font: inherit; }
    button, .button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--cp-border-strong); border-radius: .625rem; background: var(--cp-surface); color: var(--cp-text); font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
    button:hover:not(:disabled), .button:hover { background: var(--cp-surface-soft); border-color: var(--cp-text-muted); }
    button:active:not(:disabled), .button:active { background: var(--cp-highlight); }
    button:disabled { cursor: not-allowed; color: var(--cp-text-muted); background: var(--cp-surface-soft); }
    .primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .primary:hover:not(:disabled) { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
    .primary:active:not(:disabled) { background: var(--cp-accent-hover); }
    :focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 3px; }
    a { color: var(--cp-link); text-underline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.25rem; font-weight: 650; line-height: 1.4; }
    h2 { font-size: 1.125rem; font-weight: 650; line-height: 1.5; }
    h3 { font-size: 1rem; line-height: 1.5; }
    .muted, .hint { color: var(--cp-text-muted); }
    .hint { font-size: .875rem; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    .topbar { background: var(--cp-surface); border-bottom: 1px solid var(--cp-border); }
    .topbar .wrap { min-height: 80px; display: flex; gap: 20px; align-items: center; justify-content: space-between; padding-top: 16px; padding-bottom: 16px; }
    .account { display: flex; align-items: center; gap: 16px; min-width: 0; }
    #user-name { max-width: 240px; overflow-wrap: anywhere; font-size: .875rem; }
    main.wrap { padding-top: 28px; padding-bottom: 48px; }
    .boot { padding: 48px 0; color: var(--cp-text-muted); }
    .login { max-width: 464px; margin: 40px auto; padding: 32px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; }
    .login h2 { margin-bottom: 8px; }
    .login form { margin-top: 24px; }
    .login .primary { width: 100%; margin-top: 20px; }
    label, legend { font-weight: 600; }
    input[type="password"], select { width: 100%; min-height: 44px; margin-top: 8px; padding: 8px 12px; background: var(--cp-surface); color: var(--cp-text); border: 1px solid var(--cp-border-strong); border-radius: .625rem; }
    input::placeholder { color: var(--cp-text-muted); opacity: 1; }
    input[type="radio"] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--cp-accent); flex-shrink: 0; }
    fieldset { padding: 0; margin: 24px 0 0; border: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 8px; }
    .servicebar { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 24px; }
    .service-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .worker { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .worker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cp-border-strong); }
    .worker[data-state="ready"]::before { background: var(--cp-success); }
    .worker[data-state="busy"]::before { background: var(--cp-warning); }
    .worker[data-state="offline"]::before { background: var(--cp-danger); }
    #worker-help { margin-top: 4px; max-width: 75ch; }
    .workspace { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 28px; align-items: start; }
    .upload-panel { padding: 24px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    .section-intro { margin: 4px 0 20px; }
    .dropzone { padding: 24px 16px; border: 1px dashed var(--cp-border-strong); border-radius: .625rem; background: var(--cp-bg-elevated); text-align: center; }
    .dropzone[data-drag="true"] { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .dropzone svg { display: block; width: 28px; height: 28px; margin: 0 auto 12px; color: var(--cp-text-muted); stroke: var(--cp-text-muted); fill: none; }
    .file-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
    .selection { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-top: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--cp-border); }
    .selection strong { display: block; font-size: .9375rem; overflow-wrap: anywhere; }
    .text-button { background: var(--cp-surface); border-color: var(--cp-border); padding: 8px 12px; flex-shrink: 0; }
    .field { margin-top: 24px; }
    .field .hint { margin-top: 8px; }
    .radio-option { display: flex; align-items: start; gap: 10px; padding: 8px 0; font-size: .9375rem; cursor: pointer; font-weight: 400; }
    .radio-option strong { display: block; font-weight: 600; }
    .data-note { margin-top: 8px; }
    .submit-row { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--cp-border); }
    #submit-job { width: 100%; }
    #submit-help { margin-top: 8px; }
    .notice { padding: 12px 16px; border: 1px solid var(--cp-border-strong); border-radius: .625rem; background: var(--cp-surface); overflow-wrap: anywhere; }
    .notice[data-tone="error"] { border-color: var(--cp-danger); }
    .notice[data-tone="success"] { border-color: var(--cp-success); }
    .notice[data-tone="warning"] { border-color: var(--cp-warning); }
    #login-message, #upload-message { margin-top: 16px; font-size: .9375rem; }
    .sync-notice { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .sync-notice p { flex: 1; }
    .task-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 4px 0 16px; }
    .task-heading .hint { margin-top: 4px; }
    .empty { padding: 40px 24px; border-top: 1px solid var(--cp-border); text-align: center; }
    .empty p { margin-top: 8px; }
    .jobs { list-style: none; padding: 0; margin: 0; }
    .job { padding: 20px 0; border-top: 1px solid var(--cp-border); }
    .job-top { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
    .job-title { overflow-wrap: anywhere; min-width: 0; font-weight: 650; }
    .badge { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: .8125rem; font-weight: 600; color: var(--cp-text); background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 6px; padding: 2px 8px; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cp-border-strong); }
    .badge[data-status="running"]::before, .badge[data-status="queued"]::before { background: var(--cp-warning); }
    .badge[data-status="succeeded"]::before { background: var(--cp-success); }
    .badge[data-status="failed"]::before { background: var(--cp-danger); }
    .job-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: .875rem; color: var(--cp-text-muted); }
    .job-message { margin-top: 12px; font-size: .9375rem; overflow-wrap: anywhere; }
    .job-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .job-actions a { font-size: .875rem; }
    .job-actions .download { color: var(--cp-accent); border-color: var(--cp-accent); }
    .job-actions .secondary-link { padding: 8px; min-height: 44px; display: inline-flex; align-items: center; }
    details { margin-top: 12px; font-size: .875rem; }
    summary { cursor: pointer; color: var(--cp-text-muted); padding: 8px 0; width: fit-content; }
    .detail-body { margin-top: 8px; padding: 12px 16px; background: var(--cp-surface-soft); border-radius: .625rem; overflow-wrap: anywhere; }
    .detail-body p + p { margin-top: 8px; }
    code { font: .8125rem/1.6 Consolas, "Courier New", Courier, monospace; overflow-wrap: anywhere; }
    html[data-theme="dark"] .muted, html[data-theme="dark"] .hint,
    html[data-theme="dark"] .job-meta, html[data-theme="dark"] summary { color: var(--cp-text-soft); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .skip-link { position: absolute; top: -80px; left: 16px; background: var(--cp-surface); padding: 12px; z-index: 2; }
    .skip-link:focus { top: 8px; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 24px; }
      .wrap { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 760px) {
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 32px; }
      .wrap { padding-left: 16px; padding-right: 16px; }
      main.wrap { padding-top: 20px; }
      .topbar .wrap { flex-wrap: wrap; gap: 12px; }
      .account { margin-left: auto; }
      .upload-panel { padding: 20px; }
      .servicebar, .sync-notice { flex-wrap: wrap; }
      .login { padding: 24px; margin: 16px auto; }
      .job-top { gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <div class="wrap">
      <h1>PBIP ↔ PBIX 转换工作台</h1>
      <div class="account" id="account" hidden>
        <span id="user-name"></span>
        <button type="button" id="logout">退出</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main" tabindex="-1">
    <noscript><p class="notice">请启用 JavaScript，以登录、上传文件并查看转换任务。</p></noscript>
    <p class="boot" id="boot" role="status">正在检查登录状态…</p>
    <section class="login" id="login" aria-labelledby="login-title" hidden>
      <h2 id="login-title">登录转换工作台</h2>
      <p class="muted">使用管理员分配给你的个人访问凭证。</p>
      <form id="login-form">
        <label for="access-token">个人访问凭证</label>
        <input id="access-token" type="password" required autocomplete="off" spellcheck="false" autocapitalize="none" aria-describedby="token-help">
        <p id="token-help" class="hint">当前为受控试点登录，请勿与他人共用凭证。</p>
        <button type="submit" class="primary" id="login-submit">登录</button>
      </form>
      <p class="notice" id="login-message" role="alert" hidden></p>
    </section>
    <div id="app" hidden>
      <div class="servicebar">
        <div>
          <div class="service-line">
            <span class="worker" id="worker-state">正在读取节点状态</span>
            <span class="hint" id="queue-summary"></span>
          </div>
          <p id="worker-help" class="hint"></p>
        </div>
        <span class="hint" id="last-updated"></span>
      </div>
      <div class="notice sync-notice" id="sync-notice" role="status" hidden>
        <p id="sync-message"></p>
        <button type="button" id="retry-sync">重试连接</button>
      </div>
      <div class="workspace">
        <section class="upload-panel" aria-labelledby="upload-title">
          <h2 id="upload-title">新建转换</h2>
          <p class="hint section-intro">选择文件，确认目标格式后提交。</p>
          <form id="upload-form">
            <div class="dropzone" id="dropzone" aria-label="文件拖放区域">
              <svg viewBox="0 0 24 24" stroke-width="1.5" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M4 14v6h16v-6"/></svg>
              <p>将文件拖到这里</p>
              <p class="hint">单个 .pbix 或完整 PBIP 工程 .zip</p>
              <div class="file-actions">
                <button type="button" id="pick-file">选择文件</button>
                <button type="button" id="pick-folder" hidden>选择工程文件夹</button>
              </div>
              <input id="file-input" type="file" accept=".pbix,.zip,.pbip" hidden>
              <input id="folder-input" type="file" webkitdirectory multiple hidden>
            </div>
            <div class="selection" id="selection" hidden>
              <div><strong id="selected-name"></strong><span class="hint" id="selected-size"></span></div>
              <button class="text-button" type="button" id="clear-file">移除</button>
            </div>
            <div class="field">
              <label for="direction">转换方向</label>
              <select id="direction" aria-describedby="direction-help">
                <option value="auto">自动识别文件类型</option>
                <option value="pbix_to_pbip">PBIX → PBIP工程</option>
                <option value="pbip_to_pbix">PBIP工程 → PBIX</option>
              </select>
              <p class="hint" id="direction-help">.pbix 转成 PBIP 工程；工程 .zip 转成 .pbix。</p>
            </div>
            <fieldset id="export-options" hidden>
              <legend>PBIP 工程内容</legend>
              <label class="radio-option">
                <input type="radio" name="export-mode" value="definitions" checked>
                <span><strong>可编辑工程（不含数据缓存）</strong><span class="hint">适合编辑报表和模型定义。不含数据缓存并不等于脱敏，查询和模型定义中仍可能有内嵌数据或连接信息。</span></span>
              </label>
              <label class="radio-option">
                <input type="radio" name="export-mode" value="portable">
                <span><strong>完整工程（含数据，可用于离线转回）</strong><span class="hint">在支持的条件下保留离线转回所需的数据。</span></span>
              </label>
              <p class="hint data-note" id="data-note">转回 PBIX 时可能需要重新加载数据。</p>
            </fieldset>
            <p class="notice" id="upload-message" role="alert" hidden></p>
            <details id="upload-diagnostics" hidden>
              <summary>上传诊断信息</summary>
              <div class="detail-body" id="upload-diagnostic-body"></div>
            </details>
            <div class="submit-row">
              <button class="primary" id="submit-job" type="submit" disabled>提交转换</button>
              <p class="hint" id="submit-help">登录后仅可查看和下载自己的任务。</p>
              <p class="hint" id="upload-limit"></p>
            </div>
          </form>
        </section>
        <section aria-labelledby="jobs-title">
          <div class="task-heading">
            <div><h2 id="jobs-title">我的任务</h2><p class="hint" id="jobs-description">状态自动更新；排队中的任务可取消。</p></div>
            <button type="button" id="refresh-jobs">刷新</button>
          </div>
          <div class="empty" id="jobs-empty"><h3 id="empty-title">正在读取任务…</h3><p class="hint" id="empty-help">从服务端获取你的任务列表。</p></div>
          <ul class="jobs" id="jobs-list" aria-label="我的转换任务"></ul>
        </section>
      </div>
    </div>
    <p class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const directions = { pbix_to_pbip: "PBIX → PBIP工程", pbip_to_pbix: "PBIP工程 → PBIX" };
      const states = { queued: "排队", running: "处理中", succeeded: "完成", failed: "失败", cancelled: "已取消" };
      const artifactLabels = { pbix: "下载 PBIX", pbip: "下载 PBIP 工程 ZIP", verification: "转换检查记录" };
      const state = {
        user: null, csrf: "", epoch: 0, controllers: new Set(), timer: null,
        refreshing: false, failures: 0, status: null, statusFresh: false,
        files: [], folder: false, uploading: false, uncertain: false, uncertainChecked: false,
        jobs: new Map(), jobsVersion: 0, cancelling: new Set(), loginBusy: false
      };
      class ApiError extends Error {
        constructor(message, code, status = 0) { super(message); this.code = code; this.status = status; }
      }
      function announce(message) { $("announcer").textContent = message; }
      function notice(id, message, tone = "error") {
        const element = $(id);
        if (id === "upload-message") $("upload-diagnostics").hidden = true;
        element.textContent = message;
        element.dataset.tone = tone;
        element.hidden = !message;
      }
      function formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes < 0) return "大小未知";
        if (bytes < 1024) return bytes + " B";
        const unit = bytes < 1048576 ? "KB" : bytes < 1073741824 ? "MB" : "GB";
        const divisor = unit === "KB" ? 1024 : unit === "MB" ? 1048576 : 1073741824;
        return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 1 }).format(bytes / divisor) + " " + unit;
      }
      function formatDate(value) {
        const date = new Date(value);
        return value && !Number.isNaN(date.getTime()) ? new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit", day: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
        }).format(date) : "时间暂不可用";
      }
      function errorText(error, fallback) {
        if (error.code === "NETWORK_ERROR") return "网络连接失败。请检查网络后重试。";
        if (error.code === "TIMEOUT") return "服务响应超时，请稍后重试。";
        if (error.code === "AUTH_RATE") return "登录尝试过于频繁，请等待一分钟后重试。";
        if (error.code === "WORKER_PATH_LENGTH") return "节点工作目录过长，无法接收此工程。请联系管理员缩短工作目录后重试。";
        if (error.code === "JOB_ALREADY_RUNNING") return "任务已被节点领取，无法取消。请刷新查看最新状态。";
        if (["PORTABLE_CACHE_MISSING", "DATA_CACHE_REQUIRED"].includes(error.code)) return "缺少所需的数据缓存。请查看诊断信息并重新加载数据，不能保证此工程直接离线转回。";
        if (error.code === "PBIX_INVALID") return "文件不是有效的 PBIX。请先确认它能在 Power BI Desktop 中打开，再重新选择。";
        if (error.code === "PBIX_UNSUPPORTED") return "当前服务不支持此 PBIX 格式或连接模式。请查看诊断信息并联系管理员。";
        if (error.code === "PBIX_LABEL_UNSUPPORTED") return "当前服务不支持此 PBIX 的保护或标签类型，请联系管理员确认可处理的格式。";
        if (error.code === "EXPORT_SIZE") return "导出结果超过服务限制，请联系管理员调整限制后重试。";
        if (error.status === 413) return "文件超出服务允许的大小，请减小文件或联系管理员调整限制。";
        if (error.status === 429) return "当前排队任务已达上限。请等待已有任务结束后再提交。";
        if (error.status === 403) return "会话权限或安全校验未通过。请退出后重新登录；仍失败时联系管理员。";
        return fallback + (error.code ? "（" + error.code + "）" : "");

        } catch (error) {
          if (handleSessionError(error, epoch)) return;
          syncNotice(error.status === 409 || error.code === "JOB_ALREADY_RUNNING" ? "任务已被节点领取或状态已变化，无法取消。请刷新查看最新状态。" : errorText(error, "取消未完成，请刷新确认。"));
        } finally {
          if (epoch === state.epoch) {
            state.jobsVersion++;
            state.cancelling.delete(jobId);
            renderJobs(Array.from(state.jobs.values()));
          }
        }
      }
      $("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (state.loginBusy) return;
        let token = $("access-token").value.trim();
        $("access-token").value = "";
        if (!token) { notice("login-message", "请输入管理员分配的个人访问凭证。"); return; }
        state.loginBusy = true;
        $("login-submit").disabled = true;
        $("login-submit").textContent = "正在登录…";
        notice("login-message", "");
        try {
          const request = api("/api/session", { method: "POST", headers: { Authorization: "Bearer " + token } });
          token = "";
          acceptSession(await request);
        } catch (error) {
          notice("login-message", error.status === 401 ? "凭证无效或已撤销，请重新输入或联系管理员。" : errorText(error, "登录失败，请重试。"));
        } finally {
          token = "";
          state.loginBusy = false;
          $("login-submit").disabled = false;
          $("login-submit").textContent = "登录";
        }
      });
      $("logout").addEventListener("click", async () => {
        if (!state.user) return;
        const epoch = state.epoch;
        $("logout").disabled = true;
        $("logout").textContent = "正在退出…";
        try {
          await api("/api/session", { method: "DELETE", headers: csrfHeaders() });
          if (epoch === state.epoch) { showLogin(); announce("已退出登录。"); $("access-token").focus(); }
        } catch (error) {
          if (handleSessionError(error, epoch)) return;
          syncNotice("退出未完成，会话可能仍有效。" + errorText(error, "请重试退出。"));
          $("logout").disabled = false;
          $("logout").textContent = "重试退出";
        }
      });
      $("pick-file").addEventListener("click", () => $("file-input").click());
      $("pick-folder").addEventListener("click", () => $("folder-input").click());
      $("file-input").addEventListener("change", (event) => selectFiles(Array.from(event.target.files)));
      $("folder-input").addEventListener("change", (event) => selectFiles(Array.from(event.target.files), true));
      $("clear-file").addEventListener("click", () => { clearSelection(); notice("upload-message", ""); $("pick-file").focus(); });
      $("direction").addEventListener("change", updateForm);
      $("export-options").addEventListener("change", updateForm);
      for (const eventName of ["dragenter", "dragover"]) $("dropzone").addEventListener(eventName, (event) => {
        event.preventDefault();
        if (!state.uploading) $("dropzone").dataset.drag = "true";
      });
      $("dropzone").addEventListener("dragleave", (event) => {
        if (!$("dropzone").contains(event.relatedTarget)) $("dropzone").dataset.drag = "false";
      });
      $("dropzone").addEventListener("drop", (event) => {
        event.preventDefault();
        $("dropzone").dataset.drag = "false";
        if (state.uploading) return;
        const entries = Array.from(event.dataTransfer.items || []);
        if (entries.some((item) => item.webkitGetAsEntry?.()?.isDirectory)) {
          notice("upload-message", $("pick-folder").hidden ? "请将完整工程打包为 ZIP 后上传。" : "文件夹请使用“选择工程文件夹”，以保留完整工程路径。"); return;
        }
        selectFiles(Array.from(event.dataTransfer.files));
      });
      window.addEventListener("dragover", (event) => event.preventDefault());
      window.addEventListener("drop", (event) => event.preventDefault());
      $("upload-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!state.user || state.uploading || state.uncertain || !state.statusFresh) return;
        const validation = validateSelection();
        if (validation) { notice("upload-message", validation); return; }
        const epoch = state.epoch;
        state.uploading = true;
        notice("upload-message", "");
        updateForm();
        const body = new FormData();
        if (state.folder) for (const file of state.files) body.append("project_files", file, file.webkitRelativePath);
        else body.append("file", state.files[0], state.files[0].name);
        body.append("direction", $("direction").value);
        if (effectiveDirection() === "pbix_to_pbip") body.append("export_mode", document.querySelector('input[name="export-mode"]:checked').value);
        try {
          const result = await api("/api/jobs", { method: "POST", headers: csrfHeaders(), body, timeout: 600000 });
          if (epoch !== state.epoch) return;
          if (!result.job || typeof result.job.job_id !== "string") throw new ApiError("服务已响应，但未返回任务。请刷新任务列表确认是否已提交。", "INVALID_JOB");
          state.jobsVersion++;
          const jobs = [result.job, ...Array.from(state.jobs.values()).filter((job) => job.job_id !== result.job.job_id)];
          renderJobs(jobs);
          clearSelection();
          notice("upload-message", "任务已创建，可在“我的任务”查看状态和下载结果。", "success");
          announce("任务已创建。");
        } catch (error) {
          if (handleSessionError(error, epoch)) return;
          const ambiguous = ["NETWORK_ERROR", "TIMEOUT", "INVALID_RESPONSE", "INVALID_JOB"].includes(error.code) || error.status >= 500;
          state.uncertain = ambiguous;
          state.uncertainChecked = false;
          notice("upload-message", ambiguous ? "尚未确认任务是否创建。请先刷新“我的任务”核对，避免重复提交。" : errorText(error, "上传失败，请重试。"), ambiguous ? "warning" : "error");
          $("upload-diagnostic-body").replaceChildren();
          addDetail($("upload-diagnostic-body"), "错误代码", error.code, true);
          addDetail($("upload-diagnostic-body"), "服务端诊断", error.message);
          $("upload-diagnostics").hidden = false;
          if (ambiguous) showUncertainAction();
        } finally {
          if (epoch === state.epoch) {
            state.uploading = false;
            updateForm();
            scheduleRefresh();
          }
        }
      });
      function showUncertainAction() {
        if ($("confirm-resubmit")) return;
        const button = textNode("button", "text-button", "已核对任务，允许重新提交");
        button.id = "confirm-resubmit";
        button.type = "button";
        button.disabled = true;
        button.addEventListener("click", () => {
          if (!state.uncertainChecked || !state.statusFresh) return;
          state.uncertain = false;
          state.uncertainChecked = false;
          button.remove();
          notice("upload-message", "请确认任务列表中没有刚才的提交，再点击“提交转换”。", "warning");
          updateForm();
        });
        $("upload-message").after(button);
      }
      function retry() {
        state.failures = 0;
        refresh();
      }
      $("refresh-jobs").addEventListener("click", retry);
      $("retry-sync").addEventListener("click", retry);
      document.addEventListener("visibilitychange", () => {
        if (!state.user) return;
        if (document.hidden) scheduleRefresh();
        else if (state.failures < 3) refresh();
      });
      window.addEventListener("offline", () => {
        clearTimeout(state.timer);
        state.statusFresh = false;
        if (state.user) syncNotice("网络已断开。恢复连接后可重试；已提交的任务不受页面断线影响。");
        updateForm();
      });
      window.addEventListener("online", () => { if (state.user) retry(); });
      window.addEventListener("pagehide", stopRequests);
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) { showLogin(); bootstrap(); }
      });
      window.addEventListener("beforeunload", (event) => {
        if (state.uploading) { event.preventDefault(); event.returnValue = ""; }
      });
      async function bootstrap() {
        try { acceptSession(await api("/api/session")); }
        catch (error) { showLogin(error.status === 401 ? "" : errorText(error, "无法连接服务，请稍后登录重试。")); }
      }
      bootstrap();
    })();
  </script>
</body>
</html>
