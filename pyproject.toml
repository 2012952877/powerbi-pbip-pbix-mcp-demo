[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pbip-mcp-conversion-demo"
version = "0.2.4"
description = "Authenticated durable MCP and portal jobs for bidirectional Power BI Desktop conversion"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp==2.1.1",
  "starlette==1.6.0",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[project.scripts]
pbip-mcp = "pbip_mcp.server:main"
pbip-worker = "pbip_mcp.worker:main"
pbip-client = "pbip_mcp.client:main"
pbip-portal = "pbip_mcp.portal:main"
pbip-admin = "pbip_mcp.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbip_mcp = ["web_ui/*.html"]
